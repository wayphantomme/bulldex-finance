      abi: Pool
      startBlock: 11556913
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Swap
        - LiquidityEvent
        - User
        - Protocol
      abis:
        - name: Pool
          file: PoolBdxMusdc/Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,uint256,uint256,indexed address)
          handler: handleSwap
        - event: AddLiquidity(indexed address,uint256,uint256,uint256)
          handler: handleAddLiquidity
        - event: RemoveLiquidity(indexed address,uint256,uint256,uint256)
