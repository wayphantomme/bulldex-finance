name: Smart Contract Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'

jobs:
  test:
    name: Foundry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: forge --version

      - name: Install dependencies (forge install)
        run: cd contracts && forge install

      - name: Build contracts
        run: cd contracts && forge build --sizes

      - name: Run unit tests
        run: cd contracts && forge test -vvv

      - name: Run gas report
        run: cd contracts && forge test --gas-report

      - name: Run coverage
        run: cd contracts && forge coverage --report summary

      - name: Run fuzz tests (CI profile — 10k runs)
        run: cd contracts && FOUNDRY_PROFILE=ci forge test --match-path "test/fuzz/**" -vv
        continue-on-error: true  # fuzz tests are best-effort in CI

  lint:
    name: Solidity Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check formatting
        run: cd contracts && forge fmt --check
