name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  lint-and-typecheck:
    name: Lint + Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Lint
        run: cd frontend && npm run lint

      - name: Check formatting
        run: cd frontend && npm run format:check

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      # Dummy values so the build doesn't fail without real env vars
      NEXT_PUBLIC_SEPOLIA_RPC: https://eth-sepolia.g.alchemy.com/v2/demo
      NEXT_PUBLIC_TOKEN_ADDRESS: '0x0000000000000000000000000000000000000000'
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Next.js app
        run: cd frontend && npm run build
